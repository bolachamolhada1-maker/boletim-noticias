name: Boletim de Notícias

on:
  schedule:
    # 17h de Brasília (BRT = UTC-3) corresponde a 20h UTC
    # Executa de segunda a sexta-feira
    - cron: "0 20 * * 1-5"

  # Permite disparar manualmente via interface web do GitHub
  workflow_dispatch:
    inputs:
      preview:
        description: "Executar em modo prévia (apenas log, sem enviar ao Telegram)?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: telegram-news-production-state
  cancel-in-progress: false

jobs:
  enviar-boletim:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      BOT_PERSIST_GIT: "1"
      BOT_STATE_BRANCH: ${{ github.event.repository.default_branch }}

    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Atualizar checkout após espera na fila
        run: git pull --ff-only origin "$BOT_STATE_BRANCH"

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes de regressão sem serviços externos
        run: python tools/run_regressions.py

      - name: Executar Boletim
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then
            python news_bot.py --preview
          else
            python news_bot.py
          fi

      - name: Salvar histórico de notícias
        if: always() && github.event.inputs.preview != 'true'
        run: |
          python delivery_state.py

      - name: Preservar estado para diagnóstico após falha
        if: failure() && github.event.inputs.preview != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delivery-state-${{ github.run_id }}
          path: |
            history.json
            delivery_state.json
          retention-days: 14
