name: Boletim de Notícias

on:
  schedule:
    # 18h de Brasília (BRT = UTC-3) corresponde a 21h UTC
    # Executa de segunda a sexta-feira
    - cron: "0 21 * * 1-5"

  # Permite disparar manualmente via interface web do GitHub
  workflow_dispatch:
    inputs:
      preview:
        description: "Executar em modo prévia (apenas log, sem enviar ao Telegram)?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  enviar-boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar Boletim
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then
            python news_bot.py --preview
          else
            python news_bot.py
          fi

      - name: Salvar histórico de notícias
        if: github.event.inputs.preview != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(history): atualiza histórico de envios [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
